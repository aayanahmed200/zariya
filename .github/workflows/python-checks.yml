name: Application checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Check frontend JavaScript syntax
        run: |
          node --check webapp/static/app.js
          node --check public/static/app.js
          node --check webapp/static/sse.js
          node --check public/static/sse.js
          node --check webapp/static/workspace-sync.js
          node --check public/static/workspace-sync.js
          node --check webapp/static/workspace-search.js
          node --check public/static/workspace-search.js
          node tests/test_sse.cjs
          node tests/test_workspace_sync.cjs
          node tests/test_workspace_search.cjs
      - name: Verify deployable and source assets match
        run: |
          cmp webapp/static/app.js public/static/app.js
          cmp webapp/static/sse.js public/static/sse.js
          cmp webapp/static/workspace-sync.js public/static/workspace-sync.js
          cmp webapp/static/workspace-search.js public/static/workspace-search.js
          cmp webapp/static/style.css public/static/style.css
      - name: Run backend and route tests
        run: python -m pytest tests/ -q
